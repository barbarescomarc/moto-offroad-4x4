name: Debug ORS key (temporaire)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Tester la clé ORS
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: |
          echo "Longueur de la clé : ${#ORS_API_KEY}"
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST 'https://api.openrouteservice.org/v2/directions/driving-car/geojson' \
            -H "Authorization: $ORS_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"coordinates":[[6.0,44.0],[6.05,44.05]]}')
          echo "Code HTTP : $HTTP_CODE"
          echo "Corps de la réponse :"
          cat /tmp/resp.json
