name: Build APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # Permet de lancer manuellement depuis GitHub

permissions:
  contents: write   # nécessaire pour publier une Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Récupérer le code ────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java 17 (requis pour Android) ───────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Flutter stable (dernière version) ────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.3'
          cache: true

      # ── 4. Supprimer le fichier GeneratedPluginRegistrant v1 ─
      - name: Remove v1 embedding file
        run: |
          rm -rf android/app/src/main/java/
          echo "Fichier v1 supprimé"

      # ── 5a. Créer api_keys.dart (gitignored) ────────────────
      - name: Create api_keys.dart
        env:
          # Clé OpenRouteService (guidage GPS). Secret GitHub optionnel :
          # absent, l'APK embarque le placeholder et le guidage vers une
          # destination affiche « clé non configurée ».
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: |
          mkdir -p lib/config
          cat > lib/config/api_keys.dart << 'EOF'
          class ApiKeys {
            ApiKeys._();
            static const String ignApiKey = '';
            static const String googlePlacesKey = '';
            static const String tomTomKey = '';
            static const String openRouteServiceApiKey = '__ORS_API_KEY__';
            static const String openMeteoBaseUrl = 'https://api.open-meteo.com/v1';
            static const String openMeteoArchiveUrl = 'https://archive-api.open-meteo.com/v1';
            static const String rainViewerApiUrl = 'https://api.rainviewer.com/public/weather-maps.json';
            static const String rainViewerTileUrl = 'https://tilecache.rainviewer.com';
            static const String overpassUrl = 'https://overpass-api.de/api/interpreter';
            static bool get isIgnConfigured => ignApiKey.isNotEmpty;
            static bool get isGoogleConfigured => googlePlacesKey.isNotEmpty;
            static bool get isTomTomConfigured => tomTomKey.isNotEmpty;
            static bool get isOrsConfigured => openRouteServiceApiKey != 'VOTRE_CLE_ORS_ICI';
            static bool get isWeatherReady => true;
            static bool get isRadarReady => true;
            static bool get isOsmReady => true;
          }
          EOF
          sed -i "s|__ORS_API_KEY__|${ORS_API_KEY:-VOTRE_CLE_ORS_ICI}|" lib/config/api_keys.dart
          echo "api_keys.dart créé"

      # ── 5b. Créer les dossiers assets requis ────────────────
      - name: Create asset directories
        run: |
          mkdir -p assets/icons assets/maps
          touch assets/icons/.keep assets/maps/.keep

      # ── 6. Dépendances Flutter ──────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── 7. Vérification rapide du code ─────────────────────
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true   # Ne bloque pas le build si warnings

      # ── 8. Lire la version déclarée dans pubspec.yaml ───────
      # C'est elle qui décide s'il y a une nouvelle version à publier.
      - name: Lire la version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version déclarée : $VERSION"

      # ── 9. Compilation APK release ─────────────────────────
      # --release et non --debug : trois fois plus léger à télécharger.
      # La signature retombe sur la clé de debug (android/app/build.gradle),
      # ce qui suffit pour une installation hors Play Store.
      - name: Build APK release
        run: flutter build apk --release

      - name: Renommer l'APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/moto-offroad.apk

      # ── 10. Upload de l'APK comme artefact ──────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moto-offroad-apk
          path: build/app/outputs/flutter-apk/moto-offroad.apk
          retention-days: 30   # Disponible 30 jours

      # ── 11. Afficher la taille de l'APK ────────────────────
      - name: APK info
        run: |
          APK="build/app/outputs/flutter-apk/moto-offroad.apk"
          if [ -f "$APK" ]; then
            SIZE=$(du -h "$APK" | cut -f1)
            echo "✅ APK compilé avec succès : $SIZE"
          else
            echo "❌ APK non trouvé"
            exit 1
          fi

      # ── 12. Publier une Release si la version a changé ──────
      # Un artefact d'Actions est un zip réservé aux comptes GitHub. Une
      # Release, sur un dépôt public, donne une URL de téléchargement direct
      # que l'on peut envoyer à n'importe qui :
      #   .../releases/latest/download/moto-offroad.apk
      # On ne publie que si le tag n'existe pas encore : les pushes ordinaires
      # compilent sans rien annoncer aux utilisateurs.
      - name: Publier la Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "La version v$VERSION est déjà publiée — rien à annoncer."
            exit 0
          fi
          gh release create "v$VERSION" \
            build/app/outputs/flutter-apk/moto-offroad.apk \
            --title "MOTO OFFROAD 4X4 $VERSION" \
            --notes "Téléchargement direct : l'APK ci-dessous.

          Sur Android, autorisez l'installation depuis cette source lorsque le téléphone le demande.
          Lien permanent vers la dernière version :
          https://github.com/${{ github.repository }}/releases/latest/download/moto-offroad.apk"
          echo "✅ Release v$VERSION publiée"
