name: Debug keystore (temporaire)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.3'
          cache: true

      - name: Remove v1 embedding file
        run: rm -rf android/app/src/main/java/

      - name: Create api_keys.dart
        run: |
          mkdir -p lib/config
          cat > lib/config/api_keys.dart << 'EOF'
          class ApiKeys {
            ApiKeys._();
            static const String ignApiKey = '';
            static const String googlePlacesKey = '';
            static const String tomTomKey = '';
            static const String openRouteServiceApiKey = 'VOTRE_CLE_ORS_ICI';
            static const String dataTourismeApiKey = 'VOTRE_CLE_DATATOURISME_ICI';
            static const String openMeteoBaseUrl = 'https://api.open-meteo.com/v1';
            static const String openMeteoArchiveUrl = 'https://archive-api.open-meteo.com/v1';
            static const String rainViewerApiUrl = 'https://api.rainviewer.com/public/weather-maps.json';
            static const String rainViewerTileUrl = 'https://tilecache.rainviewer.com';
            static const String overpassUrl = 'https://overpass-api.de/api/interpreter';
            static bool get isIgnConfigured => ignApiKey.isNotEmpty;
            static bool get isGoogleConfigured => googlePlacesKey.isNotEmpty;
            static bool get isTomTomConfigured => tomTomKey.isNotEmpty;
            static bool get isOrsConfigured => openRouteServiceApiKey != 'VOTRE_CLE_ORS_ICI';
            static bool get isDataTourismeConfigured => dataTourismeApiKey != 'VOTRE_CLE_DATATOURISME_ICI';
            static bool get isWeatherReady => true;
            static bool get isRadarReady => true;
            static bool get isOsmReady => true;
          }
          EOF

      - name: Create asset directories
        run: |
          mkdir -p assets/icons assets/maps
          touch assets/icons/.keep assets/maps/.keep

      - name: Installer la clé de signature debug stable
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "Longueur du secret : ${#ANDROID_DEBUG_KEYSTORE_BASE64}"
          echo -n "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          echo "Taille du fichier décodé : $(wc -c < ~/.android/debug.keystore) octets"
          echo "--- Empreinte du keystore installé (avant build) ---"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey 2>&1 | grep -A1 "SHA256"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - name: Empreinte de l'APK compilé
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          echo "--- Empreinte de signature de l'APK produit ---"
          "$BUILD_TOOLS/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Vérifier si Gradle a regénéré un keystore ailleurs
        run: |
          find / -iname "debug.keystore" -not -path "/proc/*" 2>/dev/null | while read -r f; do
            echo "Trouvé : $f ($(wc -c < "$f") octets, modifié: $(stat -c %y "$f"))"
          done
