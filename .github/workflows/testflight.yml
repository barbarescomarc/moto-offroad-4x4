name: Publier sur TestFlight

# Déclenchement manuel uniquement : contrairement au build Android (publié à
# chaque push si la version a changé), un envoi TestFlight consomme un numéro
# de build qui ne peut jamais être réutilisé pour la même version. C'est donc
# une action volontaire (onglet Actions → Publier sur TestFlight → Run
# workflow), pas un automatisme sur push.

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.3'
          cache: true

      - name: Create api_keys.dart
        env:
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
        run: |
          mkdir -p lib/config
          cat > lib/config/api_keys.dart << 'EOF'
          class ApiKeys {
            ApiKeys._();
            static const String ignApiKey = '';
            static const String googlePlacesKey = '';
            static const String tomTomKey = '';
            static const String openRouteServiceApiKey = '__ORS_API_KEY__';
            static const String openMeteoBaseUrl = 'https://api.open-meteo.com/v1';
            static const String openMeteoArchiveUrl = 'https://archive-api.open-meteo.com/v1';
            static const String rainViewerApiUrl = 'https://api.rainviewer.com/public/weather-maps.json';
            static const String rainViewerTileUrl = 'https://tilecache.rainviewer.com';
            static const String overpassUrl = 'https://overpass-api.de/api/interpreter';
            static bool get isIgnConfigured => ignApiKey.isNotEmpty;
            static bool get isGoogleConfigured => googlePlacesKey.isNotEmpty;
            static bool get isTomTomConfigured => tomTomKey.isNotEmpty;
            static bool get isOrsConfigured => openRouteServiceApiKey != 'VOTRE_CLE_ORS_ICI';
            static bool get isWeatherReady => true;
            static bool get isRadarReady => true;
            static bool get isOsmReady => true;
          }
          EOF
          sed -i '' "s|__ORS_API_KEY__|${ORS_API_KEY:-VOTRE_CLE_ORS_ICI}|" lib/config/api_keys.dart

      - name: Create asset directories
        run: |
          mkdir -p assets/icons assets/maps
          touch assets/icons/.keep assets/maps/.keep

      - name: Flutter pub get
        run: flutter pub get

      # ── Certificat de distribution dans un trousseau temporaire ─────
      - name: Installer le certificat de signature
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          KEYCHAIN=ios-build.keychain
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          echo -n "$IOS_DIST_CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain

      # ── Profil de provisioning App Store ────────────────────────────
      - name: Installer le profil de provisioning
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            -o "$PROFILES_DIR/moto-offroad.mobileprovision"

      # ── Clé API App Store Connect (pour l'envoi, pas la signature) ──
      - name: Installer la clé API App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > \
            ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: Créer ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.motooffroad</key>
              <string>MOTO OFFROAD 4X4 App Store</string>
            </dict>
          </dict>
          </plist>
          EOF

      # ── Archive puis IPA signés ──────────────────────────────────────
      # flutter build ios --no-codesign prépare les frameworks Flutter et les
      # pods sans signer ; l'archive Xcode elle-même applique la signature
      # manuelle (certificat + profil installés ci-dessus).
      - name: Préparer le projet iOS
        run: flutter build ios --release --no-codesign

      # La signature manuelle (certificat + profil) est déclarée dans les
      # réglages de build Release du seul target Runner (project.pbxproj) :
      # la passer en argument xcodebuild s'appliquerait aussi aux targets des
      # pods/paquets Swift tiers, qui ne supportent pas un profil de
      # provisioning et font échouer l'archive.
      - name: Configurer l'équipe de signature
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/__APPLE_TEAM_ID__/${APPLE_TEAM_ID}/" ios/Runner.xcodeproj/project.pbxproj

      - name: Archiver avec Xcode
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -archivePath build/ios/Runner.xcarchive \
            -destination generic/platform=iOS \
            archive

      - name: Exporter et envoyer sur TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
