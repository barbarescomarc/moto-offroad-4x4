name: moto_offroad
description: Application GPS offroad moto — France & Europe
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Carte & GPS ─────────────────────────────────────
  flutter_map: ^8.0.0          # Carte OSM/tile rendering
  latlong2: ^0.9.0             # Coordonnées GPS
  geolocator: ^11.0.0          # Position GPS temps réel
  # flutter_compass supprimé (v1 embedding) — à réintégrer en v0.8+ ultérieurement

  # ── GPX ─────────────────────────────────────────────
  gpx: ^2.2.0                  # Parser GPX
  file_picker: ^8.0.0          # Import fichier GPX
  path_provider: ^2.1.0        # Chemins fichiers locaux

  # ── État / Navigation ────────────────────────────────
  provider: ^6.1.0             # State management
  go_router: ^13.0.0           # Navigation déclarative

  # ── Météo & APIs ─────────────────────────────────────
  http: ^1.2.0                 # Requêtes HTTP

  # ── SOS & Sécurité ───────────────────────────────────
  url_launcher: ^6.2.0         # Appel 112, SMS, WhatsApp
  share_plus: ^7.2.0           # Partage position
  package_info_plus: ^8.0.0     # Lire la version installée (mise à jour)
  permission_handler: ^11.3.0  # Permissions Android/iOS

  # ── Stockage ─────────────────────────────────────────
  shared_preferences: ^2.2.0   # Préférences utilisateur
  sqflite: ^2.3.0              # SQLite local

  # ── Enregistrement de sorties (lot 1) ───────────────
  flutter_foreground_task: ^8.10.0   # Service d'arrière-plan + notification
  sensors_plus: ^4.0.2               # Accéléromètre (pause auto, lot 4 choc)

  # ── UI ───────────────────────────────────────────────
  wakelock_plus: ^1.1.0        # Écran actif en navigation

  # ── Guidage ──────────────────────────────────────────
  flutter_tts: ^4.0.0          # Synthèse vocale (guidage)

  # ── Utilitaires ──────────────────────────────────────
  intl: ^0.19.0                # Formatage dates/nombres
  uuid: ^4.3.0                 # IDs uniques groupes
  crypto: ^3.0.0               # Chiffrement liens Solo

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.0   # sqflite hors appareil, pour les tests
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true   # iOS refuse une icône avec canal alpha
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter_native_splash:
  color: "#000000"
  image: "assets/icons/app_splash.png"
  android_12:
    color: "#000000"
    image: "assets/icons/app_splash.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/maps/
  # Polices Rajdhani à ajouter quand les fichiers .ttf seront présents dans assets/fonts/
  # fonts:
  #   - family: Rajdhani
  #     fonts:
  #       - asset: assets/fonts/Rajdhani-Regular.ttf
  #       - asset: assets/fonts/Rajdhani-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Rajdhani-SemiBold.ttf
  #         weight: 600
